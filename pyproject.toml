[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boptrace-public"
version = "0.1.0"
description = "BopTrace Community Edition: capped diagnostics SDK for alignment gradients and probability collapse monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/probe6621/BopTrace-Public"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["boptrace*"]
